<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>経路を表示する | plateau-ui</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="map"></div>

    <aside class="guide">
      <input type="checkbox" id="fold" class="fold-toggle" aria-label="パネルを開閉" />
      <h1 class="guide-title">中野区役所 福祉課 案内図</h1>
      <label for="fold" class="fold-button" title="開く・閉じる"></label>
      <div class="fold-body">
        <!--
        The steps are the four stops the map marks, so they are written once,
        with the stops, and filled in here when the page runs.
      -->
        <ol class="route" id="route"></ol>
      </div>
    </aside>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
