<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>基本の地図 | plateau-ui</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="map"></div>

    <aside class="panel">
      <input type="checkbox" id="fold" class="fold-toggle" aria-label="パネルを開閉" />
      <h1 class="title">基本の地図</h1>
      <label for="fold" class="fold-button" title="開く・閉じる"></label>
      <div class="fold-body">
        <p class="note">地図を表示し、見た目を切り替える。</p>
        <!-- The palettes are in `data.ts`, and `ui.ts` puts a row here for each. -->
        <fieldset class="group">
          <legend>テーマ</legend>
          <div id="schemes"></div>
        </fieldset>
        <div class="group">
          <span class="heading">edges</span>
          <label class="pick"><input id="edges" type="checkbox" /> 表示</label>
        </div>
        <div class="group">
          <span class="heading">tiltShift</span>
          <label class="pick"><input id="tilt-shift" type="checkbox" checked /> 有効</label>
        </div>
      </div>
    </aside>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
