<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>GeoJSONの形を塗る | plateau-ui</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="map"></div>

    <aside class="panel">
      <!--
        Where the colour lands. The three are the library's own words, and the
        first is the one the page opens on; see `main.ts`.
      -->
      <label class="switch">
        <span>塗る先</span>
        <select id="paints">
          <option value="all">地面と建物</option>
          <option value="ground">地面だけ</option>
          <option value="buildings">建物だけ</option>
        </select>
      </label>
      <!--
        The ward under the pointer, written by `ui.ts`. Empty until there is
        one; the stylesheet holds the line's height so the panel does not jump
        as the pointer crosses a boundary.
      -->
      <p class="ward" id="ward" aria-live="polite"></p>
      <p class="note">ポインタで区を強調、クリックで固定。</p>
    </aside>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
